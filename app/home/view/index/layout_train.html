<div class="layui-row layui-col-space16">
	<div class="layui-col-md12">
		<div class="layui-card">
			<div class="layui-card-title">培训学习</div>
			<div style="padding: 12px;">
				<table id="train" lay-filter="train" class="layui-hide" style="margin-top:0"></table>
			</div>
		</div>
	</div>
</div>
<script>
//任务
function layoutTrain(table){
	table.render({
		elem: '#train'
		, url: "/train/api/get_train?limit=10" //数据接口
		, page: false //开启分页
		, cols: [[ //表头
			{field: 'id', title: 'ID编号', width: 80, align: 'center', fixed: 'left'}
				,{field:'title',title: '课程名称', minWidth: 300,templet:function(d){
					var html = '<a data-href="/train/learn/view/id/'+d.id+'.html" class="side-a">'+d.title+'</a>';
					return html;
				}}
				,{field:'cate',title: '所属分类',width:90,align:'center'}
				,{field:'start_time',title: '培训周期',width:180,align:'center',templet: function(d){
					return d.start_time_str +' 至 '+ d.end_time_str;
				}}
				,{field:'duration',title: '总时长(天)',width:90,align:'center'}
		]]
	});
}
</script>
