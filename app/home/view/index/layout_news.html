<div class="layui-row layui-col-space16">
	<div class="layui-col-md12">
		<div class="layui-card">
			<div class="layui-card-title">新闻列表</div>
			<div style="padding: 12px;">
				<table id="News" lay-filter="News" class="layui-hide" style="margin-top:0"></table>
			</div>
		</div>
	</div>
</div>
<script>
//公告
function layoutNews(table){
	table.render({
		elem: '#News'
		, url: "/home/api/get_news_list" //数据接口
		, page: false //开启分页
		, cols: [[ //表头
			{ field: 'title', title: '新闻标题',templet: '<div><a data-href="/home/news/view/id/{{d.id}}.html" class="side-a">{{d.title}}</a></div>'},
			{ field: 'create_time', title: '发布时间', align: 'center','width': 150}
		]]
	});
}
</script>
